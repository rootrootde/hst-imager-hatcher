name: Hatcher console release

on:
  push:
    tags:
      - '1.7.649-hatcher.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version (1.7.649-hatcher.N)'
        required: true
        default: '1.7.649-hatcher.2'

permissions:
  contents: read

concurrency:
  group: hatcher-console-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: osx-arm64
          - runner: macos-15-intel
            target: osx-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win-x64
          - runner: windows-11-arm
            target: win-arm64
    runs-on: ${{ matrix.runner }}
    env:
      FORK_VERSION: ${{ inputs.version || github.ref_name }}
      TARGET: ${{ matrix.target }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check fork version
        shell: bash
        run: '[[ "$FORK_VERSION" =~ ^1\.7\.649-hatcher\.[1-9][0-9]*$ ]]'
      - name: Test core and console
        shell: bash
        run: |
          dotnet test src/Hst.Imager.Core.Tests --configuration Release
          dotnet test src/Hst.Imager.ConsoleApp.Tests --configuration Release
      - name: Package console
        shell: bash
        run: bash src/publish-hatcher-console.sh "$TARGET" "$FORK_VERSION" "$RUNNER_TEMP/release"
      - name: Check archive checksums
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/release" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          for algorithm in ("sha256", "md5"):
              sidecar = next(root.glob(f"*.{algorithm}"))
              assert b"\r" not in sidecar.read_bytes(), f"Checksum must use LF: {sidecar}"
              expected, name = sidecar.read_text(encoding="utf-8").split()
              with (root / name).open("rb") as stream:
                  assert hashlib.file_digest(stream, algorithm).hexdigest() == expected
          PY
      - name: Check packaged console
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/check"
          python3 -m zipfile -e "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP/check"
          binary="$RUNNER_TEMP/check/hst.imager"
          if [[ -f "$binary.exe" ]]; then binary+=.exe; fi
          chmod +x "$binary"
          "$binary" --version
          "$binary" write --help | grep -- --verify-after
      - uses: actions/upload-artifact@v4
        with:
          name: hatcher-${{ matrix.target }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FORK_VERSION: ${{ inputs.version || github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hatcher-*
          merge-multiple: true
          path: release
      - name: Create draft release
        shell: bash
        run: |
          if gh release view "$FORK_VERSION" >/dev/null 2>&1; then
            echo "release already exists: $FORK_VERSION" >&2
            exit 1
          fi
          cd release
          shasum -a 256 -c ./*.sha256
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Console fork based on upstream 1.7.649.

          --verify-after writes first, flushes, then verifies without remounting.
          Skipped zero buffers are not compared. On macOS, disk data uses
          /dev/rdisk; enumeration and mounting keep /dev/disk. See HATCHER.md
          for SD-card measurements and remaining test limits.

          SHA-256 files verify the archives. MD5 files supply the hashes used
          by Emu68 Hatcher's tool downloader.
          NOTES
          gh release create "$FORK_VERSION" ./*.zip ./*.sha256 ./*.md5 \
            --target "$SOURCE_SHA" --title "hst-imager $FORK_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --draft --prerelease
